name: simoney
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.7.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo-simoney.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/logo-simoney.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/logo-simoney.png"
  windows:
    generate: true
    image_path: "assets/icon/logo-simoney.png"
  macos:
    generate: true
    image_path: "assets/icon/logo-simoney.png"
